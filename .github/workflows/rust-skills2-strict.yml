name: Strict Rust

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@8e82916a91d94d82b6bb31bcdfc59af06953b839 # main
    with:
      ban-python-outside-ci: true

  merge-gate:
    name: Strict Rust merge gate
    if: ${{ always() }}
    needs: [strict-rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@343303848026ed142e48a6a82e7a889080b99b26 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["strict-rust","success"]]
