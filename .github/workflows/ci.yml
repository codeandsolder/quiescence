name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
    with:
      command: >-
        cargo fmt --all -- --check &&
        CARGO_BUILD_WARNINGS=deny cargo clippy --locked --workspace --all-targets -- -D warnings &&
        cargo test --locked --workspace --all-targets &&
        RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps

  merge-gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["rust","success"]]
