name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@609668894671a19ce894b979094529beeee4339a # main
    with:
      test-impact-cargo-args: "--workspace --locked --all-targets"
      command: >-
        cargo fmt --all -- --check &&
        CARGO_BUILD_WARNINGS=deny cargo clippy --locked --workspace --all-targets -- -D warnings &&
        cargo test --locked --workspace --all-targets &&
        RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
